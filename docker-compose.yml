version: '3.8'

services:
  backend:
    build:
      context: ./backend/glasgowuniversityrowingwebsite/glasgowuniversityrowingwebsite
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend/glasgowuniversityrowingwebsite/glasgowuniversityrowingwebsite/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3