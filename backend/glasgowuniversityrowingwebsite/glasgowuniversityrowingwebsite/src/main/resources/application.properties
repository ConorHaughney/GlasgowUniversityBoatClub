spring.application.name=glasgowuniversityrowingwebsite

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# HikariCP Connection Pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JWT secret key
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# Supabase Bucket configuration
supabase.url=${SUPABASE_URL}
supabase.committee.bucket=${SUPABASE_COMMITTEE_BUCKET}
supabase.news.bucket=${SUPABASE_NEWS_BUCKET}
supabase.merch.bucket=${SUPABASE_MERCH_BUCKET}
supabase.service.role.key=${SUPABASE_KEY}

# Mailchimp Configuration
mailchimp.api.key=${MAILCHIMP_API_KEY}
mailchimp.list.id=${MAILCHIMP_LIST_ID}
mailchimp.server.prefix=${MAILCHIMP_SERVER_PREFIX}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:3000}

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Password reset settings
app.email.from=${SUPPORT_EMAIL}
app.reset.rate-limit.max=3
app.reset.rate-limit.window-minutes=60
app.reset.cleanup.interval-ms=900000

spring.config.import=optional:file:.env[.properties]